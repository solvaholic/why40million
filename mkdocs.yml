site_name: Why 40 Million?
site_description: >-
  40 million Americans have no health insurance. 40 million people suffer
  anxiety. Taylor Swift's cat scratch cost her 40 million dollars. Why is
  it always 40 million?!
site_url: https://solvaholic.github.io/why40million/
repo_url: https://github.com/solvaholic/why40million
repo_name: solvaholic/why40million
copyright: Content released under CC0 1.0. Code under MIT.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_excerpt: required
      archive_date_format: MMMM yyyy
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.smartsymbols

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - About: about.md
